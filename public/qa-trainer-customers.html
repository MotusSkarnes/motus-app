            focus: "Vaner og jevn aktivitet",
            personalGoals: "Få bedre kondisjon og komme inn i faste rutiner.",
            injuries: "Stiv hofte ved mye løping",
            coachNotes: "Trenger enkel og tydelig struktur."
          }
        ],
        exercises: [],
        programs: [
          {
            id: "p1",
            memberId: "m1",
            title: "Helkropp 2 dager i uka",
            goal: "Bygge grunnstyrke",
            notes: "Start rolig og fokuser på teknikk.",
            createdAt: "13.05.2026",
            exercises: [
              { id: "pe1", exerciseId: "e1", exerciseName: "Knebøy", sets: "3", reps: "8", weight: "40", restSeconds: "120", notes: "Kontrollert tempo" },
              { id: "pe2", exerciseId: "e2", exerciseName: "Arnold press", sets: "3", reps: "10", weight: "10", restSeconds: "90", notes: "Jevn kontroll" }
            ]
          }
        ],
        logs: [
          {
            id: "l1",
            memberId: "m1",
            programTitle: "Helkropp 2 dager i uka",
            date: "13.05.2026",
            status: "Fullført",
            note: "Fin økt."
          }
        ],
        messages: [
          { id: "c1", memberId: "m1", sender: "trainer", text: "Husk rolig start denne uka.", createdAt: "12.05.2026 09:10" },
          { id: "c2", memberId: "m1", sender: "member", text: "Supert, jeg logger økten i kveld.", createdAt: "12.05.2026 09:14" },
          { id: "c3", memberId: "m1", sender: "trainer", text: "Perfekt. Send meg gjerne en kort oppdatering etterpå.", createdAt: "13.05.2026 08:04" },
          { id: "c4", memberId: "m1", sender: "member", text: "Det skal jeg gjøre.", createdAt: "13.05.2026 08:12" }
        ]
      };

      localStorage.setItem("motus_pt_app_v2", JSON.stringify(state));

      const iframe = document.getElementById("app");
      const targetMode = new URLSearchParams(location.search).get("mode") || "overview";

      function clickButtonByText(root, text) {
        const buttons = Array.from(root.querySelectorAll("button"));
        const match = buttons.find((button) => button.textContent && button.textContent.trim().includes(text));
        if (!match) return false;
        match.click();
        return true;
      }

      /** PT-meny bruker «Klienter»; eldre tekster brukte «Kunder». */
      function clickCustomersNav(root) {
        for (const label of ["Klienter", "Kunder"]) {
          if (clickButtonByText(root, label)) return true;
        }
        return false;
      }

      function scrollTextIntoView(root, text) {
        const nodes = Array.from(root.querySelectorAll("div, h1, h2, h3, span, p"));
        const match = nodes.find((node) => node.textContent && node.textContent.trim().includes(text));
        if (!match) return false;
        match.scrollIntoView({ block: "start", behavior: "instant" });
        return true;
      }

      function prepareView() {
        const doc = iframe.contentDocument;
        if (!doc) return;

        const clickedCustomers = clickCustomersNav(doc);
        if (!clickedCustomers) {
          requestAnimationFrame(prepareView);
          return;
        }

        const runModeStep = () => {
          if (!scrollTextIntoView(doc, "Kundekort")) {
            requestAnimationFrame(runModeStep);
            return;
          }

          if (targetMode === "messages") {
            if (!clickButtonByText(doc, "Meldinger")) {
              requestAnimationFrame(runModeStep);
              return;
            }
            if (!scrollTextIntoView(doc, "Dialog med kunde")) {
              requestAnimationFrame(runModeStep);
              return;
            }
          }
          document.body.dataset.ready = "true";
        };

        requestAnimationFrame(runModeStep);
      }

      iframe.addEventListener("load", () => {
        requestAnimationFrame(prepareView);
      });

      iframe.src = "/";
    </script>
  </body>
</html>
